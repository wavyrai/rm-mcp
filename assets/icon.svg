<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2825"/><stop offset="1" stop-color="#171513"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FCFBF8"/><stop offset="1" stop-color="#ECE9E2"/></linearGradient>
    <!-- Cylinder lighting, measured across each part (objectBoundingBox), bright just off-centre. -->
    <linearGradient id="barrel" x1="1" x2="0" y1="0" y2="0">
      <stop offset="0" stop-color="#c6c4bf"/><stop offset="0.1" stop-color="#eeedea"/><stop offset="0.34" stop-color="#ffffff"/>
      <stop offset="0.68" stop-color="#f3f2ef"/><stop offset="0.9" stop-color="#dedcd7"/><stop offset="1" stop-color="#c4c2bd"/>
    </linearGradient>
    <linearGradient id="shade" x1="1" x2="0" y1="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.20"/><stop offset="0.14" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.36" stop-color="#fff" stop-opacity="0.14"/><stop offset="0.62" stop-color="#000" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="metal" x1="1" x2="0" y1="0" y2="0">
      <stop offset="0" stop-color="#6f6d68"/><stop offset="0.14" stop-color="#bab8b3"/><stop offset="0.38" stop-color="#e4e2de"/>
      <stop offset="0.7" stop-color="#a6a49f"/><stop offset="1" stop-color="#6a6863"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="psh" x="-60%" y="-10%" width="220%" height="120%"><feDropShadow dx="10" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.40"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <g transform="rotate(-7 512 540)">
    <g filter="url(#sh)">
      <rect x="250" y="176" width="500" height="700" rx="48" fill="#3B3734"/>
      <rect x="278" y="204" width="444" height="644" rx="24" fill="url(#paper)"/>
    </g>
    <g stroke="#D6D2C9" stroke-width="8" stroke-linecap="round">
      <line x1="330" y1="620" x2="670" y2="620"/>
      <line x1="330" y1="690" x2="620" y2="690"/>
      <line x1="330" y1="760" x2="560" y2="760"/>
    </g>
    <path d="M330 420 C 352 340, 386 334, 398 404 C 410 470, 446 470, 462 400 C 478 330, 514 330, 526 400 C 538 466, 572 468, 588 410 C 598 376, 612 372, 628 392"
          fill="none" stroke="#1B1A19" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- The pen, drawn upright with its tip at the origin, then turned so it writes the end of the line. -->
    <g transform="translate(628 392) rotate(214) scale(0.74)" filter="url(#psh)">
      <path d="M0 0 C 3 10, 12 50, 15 78 L-15 78 C -12 50, -3 10, 0 0 Z" fill="#141312"/>
      <path d="M0 0 C 3 10, 12 50, 15 78 L-15 78 C -12 50, -3 10, 0 0 Z" fill="url(#shade)"/>
      <path d="M-15 78 L15 78 L32 138 L-32 138 Z" fill="#413e3a"/>
      <path d="M-15 78 L15 78 L32 138 L-32 138 Z" fill="url(#shade)"/>
      <rect x="-32" y="136" width="64" height="16" fill="#151413"/>
      <rect x="-32" y="136" width="64" height="16" fill="url(#shade)"/>
      <path d="M-32 152 H32 V470 a12 12 0 0 1 -12 12 H-20 a12 12 0 0 1 -12 -12 Z" fill="url(#barrel)"/>
      <path d="M-32 152 H32 V470 a12 12 0 0 1 -12 12 H-20 a12 12 0 0 1 -12 -12 Z" fill="none" stroke="#000" stroke-opacity="0.12" stroke-width="1.5"/>
    </g>
  </g>
</svg>
